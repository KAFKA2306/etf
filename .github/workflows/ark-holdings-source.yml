name: ARK ETF holdings

on:
  push:
    branches: [main]
    paths:
      - 'collect_ark_holdings.py'
      - 'build_ark_views.py'
      - 'test_ark_holdings.py'
      - '.github/workflows/ark-holdings-source.yml'
  pull_request:
    paths:
      - 'collect_ark_holdings.py'
      - 'build_ark_views.py'
      - 'test_ark_holdings.py'
      - '.github/workflows/ark-holdings-source.yml'
  schedule:
    - cron: '30 10 * * 2-6'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest -v test_ark_holdings.py
      - name: Verify official ARK sources
        if: github.event_name == 'pull_request'
        run: python collect_ark_holdings.py --output-dir /tmp/ark-holdings
      - name: Verify deterministic readiness view on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python build_ark_views.py --output-dir /tmp/ark-views
          python - <<'PY'
          import json
          from pathlib import Path
          readiness = json.loads(Path('/tmp/ark-views/readiness.json').read_text())
          assert readiness['required_trading_days'] == 60
          assert readiness['observed_trading_days'] >= 1
          assert readiness['remaining_trading_days'] == max(0, 60 - readiness['observed_trading_days'])
          assert readiness['checks']['all_daily_sets_have_six_funds']
          assert readiness['checks']['all_snapshots_have_provenance']
          assert readiness['checks']['all_snapshot_audits_clean']
          print(readiness)
          PY
      - name: Store official holdings and build views
        if: github.event_name != 'pull_request'
        run: |
          python collect_ark_holdings.py
          python build_ark_views.py
      - name: Commit new snapshot
        if: github.event_name != 'pull_request'
        run: |
          if test -z "$(git status --porcelain -- data/ark-holdings data/ark-views)"; then
            echo 'No new ARK holdings snapshot.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/ark-holdings data/ark-views
          git commit -m 'data: snapshot ARK ETF holdings'
          git push
      - name: Close Issue 9 only after deterministic acceptance
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          complete=$(python - <<'PY'
          import json
          from pathlib import Path
          print(str(json.loads(Path('data/ark-views/readiness.json').read_text())['complete']).lower())
          PY
          )
          if [ "$complete" != 'true' ]; then
            echo '60-trading-day acceptance is not complete.'
            exit 0
          fi
          state=$(gh issue view 9 --repo "$GITHUB_REPOSITORY" --json state --jq .state)
          if [ "$state" = 'OPEN' ]; then
            gh issue close 9 --repo "$GITHUB_REPOSITORY" --reason completed --comment 'Automated acceptance gate passed: at least 60 distinct official ARK holdings dates, all six thematic ETFs present on every stored date, complete provenance, and clean identity/weight audits. See data/ark-views/readiness.json.'
          else
            echo 'Issue 9 is already closed.'
          fi
