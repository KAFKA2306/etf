name: ETF daily prices

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-prices.yml"
  schedule:
    - cron: "17 8 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: etf-daily-prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install price provider
        run: python -m pip install yfinance==1.5.2
      - name: Fetch complete daily price snapshot
        shell: bash
        run: |
          set -euo pipefail
          today="$(TZ=Asia/Tokyo date +%F)"
          python fetch.py --start 2024-01-01 --end "$today"
      - name: Commit snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices/current.json
          git commit -m "data: update ETF daily prices $(TZ=Asia/Tokyo date +%F)"
          git push
