name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "data/ark-views/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Prepare static site
        run: |
          mkdir -p docs/data
          cp data/ark-views/latest.json docs/data/latest.json
          cp data/ark-views/changes.json docs/data/changes.json
          # Both artifacts are required. Never report a successful Pages release
          # while omitting the Parquet output or its provenance manifest.
          cp data/ark-views/holdings-latest.parquet docs/data/holdings-latest.parquet
          cp data/ark-views/holdings-latest.manifest.json docs/data/holdings-latest.manifest.json
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          data = Path("docs/data")
          manifest = json.loads((data / "holdings-latest.manifest.json").read_text())
          output = data / manifest["parquet"]
          if not output.is_file():
              raise SystemExit("Parquet absent from Pages artifact")
          if len(output.read_bytes()) != manifest["parquet_bytes"]:
              raise SystemExit("Parquet size disagrees with provenance manifest")
          if hashlib.sha256(output.read_bytes()).hexdigest() != manifest["parquet_sha256"]:
              raise SystemExit("Parquet digest disagrees with provenance manifest")
          source = Path(manifest["source_snapshot"])
          if hashlib.sha256(source.read_bytes()).hexdigest() != manifest["source_snapshot_sha256"]:
              raise SystemExit("canonical ARK JSON digest disagrees with manifest")
          if manifest["record_count"] < 1 or manifest["fund_count"] != 6:
              raise SystemExit("invalid ETF Parquet record/fund count")
          print(f"VERIFIED: {manifest['record_count']} holdings / {manifest['parquet_bytes']} bytes / {manifest['as_of']}")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Wait for Pages artifact indexing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            artifacts=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts")
            if jq -e '.artifacts[]? | select(.name == "github-pages" and .expired == false)' <<<"$artifacts" >/dev/null; then
              echo "github-pages artifact is indexed"
              exit 0
            fi
            echo "Waiting for github-pages artifact index (attempt ${attempt}/30)"
            sleep 2
          done
          echo "github-pages artifact was not indexed within 60 seconds" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Verify the actually published Parquet and source manifest
        env:
          PUBLIC_DATA_URL: https://kafka2306.github.io/etf/data
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            "${PUBLIC_DATA_URL}/holdings-latest.manifest.json?verify=${GITHUB_SHA}" \
            --output /tmp/public-ark-manifest.json
          curl --fail --silent --show-error --location --retry 8 --retry-all-errors --retry-delay 3 \
            --header 'Cache-Control: no-cache' \
            "${PUBLIC_DATA_URL}/holdings-latest.parquet?verify=${GITHUB_SHA}" \
            --output /tmp/public-ark.parquet
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected = json.loads(Path("data/ark-views/holdings-latest.manifest.json").read_text())
          live = json.loads(Path("/tmp/public-ark-manifest.json").read_text())
          binary = Path("/tmp/public-ark.parquet").read_bytes()
          if expected != live:
              raise SystemExit("public manifest does not match the deployed source commit")
          if len(binary) != live["parquet_bytes"]:
              raise SystemExit("public Parquet byte count mismatch")
          if hashlib.sha256(binary).hexdigest() != live["parquet_sha256"]:
              raise SystemExit("public Parquet SHA-256 mismatch")
          if binary[:4] != b"PAR1" or binary[-4:] != b"PAR1":
              raise SystemExit("public response is not a valid Parquet container")
          print("PUBLIC HTTP VERIFIED", live["as_of"], live["record_count"],
                live["parquet_bytes"], live["parquet_sha256"])
          PY
